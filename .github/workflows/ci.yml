name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/Quests.slnx

      - name: Build
        run: dotnet build backend/Quests.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/Quests.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APK_NAME: quests-0.1.${{ github.run_number }}.apk
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 compiles with Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Write signing files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::group::Check secrets"
          missing=0
          for name in GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty (see docs/android.md)"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "::endgroup::"

          echo "::group::Write google-services.json and keystore"
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "google-services.json and keystore written"
          echo "::endgroup::"

      - name: Build web app and sync Android
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: https://${{ vars.DOMAIN }}
        run: |
          echo "::group::npm run build:android (API base $VITE_API_BASE_URL)"
          npm run build:android
          echo "::endgroup::"

      - name: Build signed APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "::group::gradlew assembleRelease"
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          echo "::endgroup::"

          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found at $apk"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          mv "$apk" "app/build/outputs/apk/release/$APK_NAME"
          echo "Built $APK_NAME ($(du -h "app/build/outputs/apk/release/$APK_NAME" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: frontend/android/app/build/outputs/apk/release/${{ env.APK_NAME }}
          if-no-files-found: error

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/quests
      IMAGE_TAG: ${{ github.sha }}
      DOMAIN: ${{ vars.DOMAIN }}
      SSH_TARGET: ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          echo "::group::SSH setup"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH key and pinned host key written"
          echo "::endgroup::"

      - name: Write .env
        env:
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'Information' }}
        run: |
          umask 077
          {
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'IMAGE=%s\n' "$IMAGE"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID"
            printf 'ALLOWED_EMAILS=%s\n' "$ALLOWED_EMAILS"
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
          } > deploy/.env
          echo ".env written for image tag $IMAGE_TAG"

      - name: Deploy
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          echo "::group::Prepare ~/quests on the instance"
          ssh "${ssh_opts[@]}" "$SSH_TARGET" 'mkdir -p ~/quests'
          scp "${ssh_opts[@]}" deploy/compose.yml deploy/Caddyfile deploy/.env "$SSH_TARGET:~/quests/"
          echo "::endgroup::"

          echo "::group::Start stack (tag $IMAGE_TAG)"
          ssh "${ssh_opts[@]}" "$SSH_TARGET" bash -s <<'REMOTE'
          set -euo pipefail
          chmod 600 ~/quests/.env
          if ! docker compose version >/dev/null 2>&1; then
            echo "::error::Docker Compose plugin is not installed on the instance (docker compose version failed)"
            exit 1
          fi
          compose() { docker compose -f ~/quests/compose.yml --project-directory ~/quests "$@"; }
          compose pull
          compose up -d --remove-orphans
          docker image prune -f
          REMOTE
          echo "::endgroup::"

      - name: Health check
        run: |
          url="https://$DOMAIN/api/health"
          echo "::group::Polling $url"
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::endgroup::"
              echo "Deployed $IMAGE_TAG to https://$DOMAIN"
              exit 0
            fi
            sleep 5
          done
          echo "::endgroup::"

          echo "::error::Health check failed for $url"
          ssh_opts=(-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$SSH_TARGET" \
            'docker compose -f ~/quests/compose.yml --project-directory ~/quests ps; docker compose -f ~/quests/compose.yml --project-directory ~/quests logs --tail 50 caddy'
          exit 1
